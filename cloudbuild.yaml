steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/arena-telegram-app:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/arena-telegram-app:latest', '.']

  # 2. Push image to registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/arena-telegram-app:$COMMIT_SHA']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'arena-telegram-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/arena-telegram-app:$COMMIT_SHA'
      - '--region'
      - 'us-east5'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/arena-telegram-app:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/arena-telegram-app:latest'
